<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>チェックイン</title>
</head>
<body>
  <p id="message">読み込み中...</p>

  <script>
    const id = new URLSearchParams(location.search).get("id");
    if (id) {
      localStorage.setItem(id, "checked");
      document.getElementById("message").textContent = "チェックインしました！";
    } else {
      document.getElementById("message").textContent = "ID がありません。";
    }
  </script>
</body>
</html>
